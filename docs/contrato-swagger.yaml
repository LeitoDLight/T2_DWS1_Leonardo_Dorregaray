openapi: 3.1.0
info:
  title: API de Gestión de Docentes
  description: API REST para realizar operaciones CRUD de docentes.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Servidor Local

tags:
  - name: Docentes
    description: Operaciones relacionadas con docentes

paths:

  /docentes:
    get:
      tags:
        - Docentes
      summary: Obtener todos los docentes
      operationId: obtenerDocentes
      responses:
        '200':
          description: Lista de docentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Docente'

    post:
      tags:
        - Docentes
      summary: Registrar un nuevo docente
      operationId: registrarDocente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocenteRequest'
      responses:
        '201':
          description: Docente registrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Docente'
        '400':
          description: Datos inválidos

  /docentes/{id}:
    get:
      tags:
        - Docentes
      summary: Obtener un docente por ID
      operationId: obtenerDocentePorId
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del docente
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Docente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Docente'
        '404':
          description: Docente no encontrado

    put:
      tags:
        - Docentes
      summary: Actualizar un docente
      operationId: actualizarDocente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocenteRequest'
      responses:
        '200':
          description: Docente actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Docente'
        '404':
          description: Docente no encontrado

    delete:
      tags:
        - Docentes
      summary: Eliminar un docente
      operationId: eliminarDocente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Docente eliminado correctamente
        '404':
          description: Docente no encontrado

components:

  schemas:

    Docente:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombres:
          type: string
          example: Juan Carlos
        apellidos:
          type: string
          example: Pérez Gómez
        correo:
          type: string
          format: email
          example: juan.perez@universidad.edu.pe
        telefono:
          type: string
          example: "987654321"
        especialidad:
          type: string
          example: Ingeniería de Software
        fechaIngreso:
          type: string
          format: date
          example: "2024-03-01"

    DocenteRequest:
      type: object
      required:
        - nombres
        - apellidos
        - correo
        - especialidad
      properties:
        nombres:
          type: string
          minLength: 2
          maxLength: 100
          example: Juan Carlos
        apellidos:
          type: string
          minLength: 2
          maxLength: 100
          example: Pérez Gómez
        correo:
          type: string
          format: email
          example: juan.perez@universidad.edu.pe
        telefono:
          type: string
          example: "987654321"
        especialidad:
          type: string
          example: Ingeniería de Software
        fechaIngreso:
          type: string
          format: date
          example: "2024-03-01"